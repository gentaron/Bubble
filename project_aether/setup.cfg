# Project AETHER Setup Configuration

[metadata]
name = project-aether
version = 1.0.0
author = AETHER Project Team
author_email = team@project-aether.dev
description = World's Most Advanced App - Quantum-resistant, Neuro-symbolic AI with Abel Prize-level Mathematics
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/aether-project/project_aether
project_urls =
    Bug Tracker = https://github.com/aether-project/project_aether/issues
    Documentation = https://docs.project-aether.dev
    Source Code = https://github.com/aether-project/project_aether
license = MIT
classifiers =
    Development Status :: 5 - Production/Stable
    Intended Audience :: Developers
    Intended Audience :: Science/Research
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Topic :: Scientific/Engineering :: Mathematics
    Topic :: Security :: Cryptography
    Topic :: Scientific/Engineering :: Artificial Intelligence
keywords = quantum-cryptography, neuro-symbolic-ai, lattice-based-cryptography, fractal-geometry, elliptic-curves, riemann-zeta

[options]
packages = find:
python_requires = >=3.9
install_requires =
    mpmath>=1.3.0
    numpy>=1.24.0
    scipy>=1.10.0
    cryptography>=41.0.0
    PyNaCl>=1.5.0
    pycryptodome>=3.19.0
    networkx>=3.1
    python-dotenv>=1.0.0
    pydantic>=2.5.0
    typing-extensions>=4.8.0

[options.extras_require]
dev =
    pytest>=7.4.0
    pytest-cov>=4.1.0
    black>=23.11.0
    flake8>=6.1.0
    mypy>=1.7.0
    pre-commit>=3.6.0
torch = torch>=2.0.0
docs =
    sphinx>=7.2.0
    sphinx-rtd-theme>=2.0.0
    mkdocs>=1.5.0
    mkdocs-material>=9.5.0
security =
    bandit>=1.7.0
    safety>=2.3.0

[options.package_data]
* = *.md, *.txt, *.html

[flake8]
max-line-length = 88
extend-ignore = E203, W503
exclude =
    .git,
    __pycache__,
    build,
    dist,
    .eggs,
    *.egg-info
per-file-ignores =
    __init__.py:F401

[mypy]
python_version = 3.9
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
check_untyped_defs = True

[tool:pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -ra -q --cov=core --cov-report=term-missing

[coverage:run]
source = core, crypto, math
branch = True

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
